stages:
  ingest:
    cmd: python -m copilot.data.pipeline ingest
    deps:
      - data/raw/customer-support-tickets.csv
      - src/copilot/data/pipeline.py
    outs:
      - data/interim/ingested.parquet

  clean:
    cmd: python -m copilot.data.pipeline clean
    deps:
      - data/interim/ingested.parquet
      - src/copilot/data/pipeline.py
      - src/copilot/data/text.py
    params:
      - language
    outs:
      - data/processed/cleaned.parquet

  dedupe:
    cmd: python -m copilot.data.pipeline dedupe
    deps:
      - data/processed/cleaned.parquet
      - src/copilot/data/pipeline.py
    outs:
      - data/processed/deduped.parquet

  split:
    cmd: python -m copilot.data.pipeline split
    deps:
      - data/processed/deduped.parquet
      - src/copilot/data/pipeline.py
    params:
      - seed
      - split
      - min_queue_count
    outs:
      - data/splits/train.csv
      - data/splits/val.csv
      - data/splits/test.csv
    metrics:
      - reports/data_audit.json:
          cache: false

  validate:
    cmd: python -m copilot.data.validate
    deps:
      - data/splits/train.csv
      - data/splits/val.csv
      - data/splits/test.csv
      - src/copilot/data/validate.py
    params:
      - language
      - min_queue_count
    metrics:
      - reports/data_validation.json:
          cache: false

  train:
    foreach: [queue, priority]
    do:
      cmd: python -m copilot.models.train --task ${item}
      deps:
        - data/splits/train.csv
        - data/splits/val.csv
        - data/splits/test.csv
        - reports/data_validation.json
        - src/copilot/data/text.py
        - src/copilot/models/train.py
        - src/copilot/models/transformer.py
        - src/copilot/models/knn.py
        - src/copilot/models/blend.py
        - src/copilot/models/metrics.py
      params:
        - seed
        - eval
        - configs/train_${item}.yaml:
            - train
      outs:
        - models/${item}_model
      metrics:
        - reports/metrics_${item}.json:
            cache: false
      plots:
        - reports/per_class_${item}.json:
            cache: false
        - reports/plots/confusion_${item}.json:
            cache: false
            template: confusion
            x: predicted
            y: actual
        - reports/plots/training_curve_${item}.json:
            cache: false
            x: epoch
            y: val_macro_f1

  evaluate:
    cmd: python -m copilot.models.evaluate
    deps:
      - models/queue_model
      - models/priority_model
      - data/splits/test.csv
      - src/copilot/models/evaluate.py
    params:
      - f1_gate
      - eval
    metrics:
      - reports/metrics_summary.json:
          cache: false

  build_faq_index:
    cmd: python -m copilot.rag.faq_index
    deps:
      - data/faq
      - src/copilot/rag/faq_index.py
    outs:
      - data/faq_index

  rag_eval:
    cmd: python -m copilot.rag.evaluate
    deps:
      - data/faq_index
      - data/splits/test.csv
      - src/copilot/rag
    params:
      - params.yaml:
          - seed
    metrics:
      - reports/rag_eval.json:
          cache: false

  simulate_stream:
    cmd: python -m copilot.incidents.simulate_stream
    deps:
      - data/processed/deduped.parquet
    outs:
      - data/interim/incident_stream.csv
    metrics:
      - reports/incident_stream_metrics.json:
          cache: false

  incident_eval:
    cmd: python -m copilot.incidents.detector
    deps:
      - data/interim/incident_stream.csv
    params:
      - params.yaml:
          - incident
    metrics:
      - reports/incident_metrics.json:
          cache: false
