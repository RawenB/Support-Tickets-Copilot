stages:
  ingest:
    cmd: python -m copilot.data.pipeline ingest
    deps:
      - data/raw/customer-support-tickets.csv
      - src/copilot/data/pipeline.py
    outs:
      - data/interim/ingested.parquet

  clean:
    cmd: python -m copilot.data.pipeline clean
    deps:
      - data/interim/ingested.parquet
      - src/copilot/data/pipeline.py
    params:
      - params.yaml:
          - language
    outs:
      - data/processed/cleaned.parquet

  dedupe:
    cmd: python -m copilot.data.pipeline dedupe
    deps:
      - data/processed/cleaned.parquet
      - src/copilot/data/pipeline.py
    outs:
      - data/processed/deduped.parquet

  split:
    cmd: python -m copilot.data.pipeline split
    deps:
      - data/processed/deduped.parquet
      - src/copilot/data/pipeline.py
    params:
      - params.yaml:
          - seed
          - split
          - min_queue_count
    outs:
      - data/splits/train.csv
      - data/splits/val.csv
      - data/splits/test.csv
    metrics:
      - reports/data_audit.json

  train_queue:
    cmd: python -m copilot.models.train --task queue
    deps:
      - data/splits/train.csv
      - data/splits/val.csv
      - configs/train_queue.yaml
    params:
      - params.yaml:
          - seed
          - train
    outs:
      - models/queue_model
    metrics:
      - reports/queue_metrics.json

  train_priority:
    cmd: python -m copilot.models.train --task priority
    deps:
      - data/splits/train.csv
      - data/splits/val.csv
      - configs/train_priority.yaml
    params:
      - params.yaml:
          - seed
          - train
    outs:
      - models/priority_model
    metrics:
      - reports/priority_metrics.json

  evaluate:
    cmd: python -m copilot.models.evaluate
    deps:
      - models/queue_model
      - models/priority_model
    params:
      - params.yaml:
          - f1_gate
    metrics:
      - reports/metrics_summary.json

  build_faq_index:
    cmd: python -m copilot.rag.faq_index
    deps:
      - data/faq/.gitkeep
    outs:
      - data/faq/index.faiss

  simulate_stream:
    cmd: python -m copilot.incidents.simulate_stream
    deps:
      - data/processed/deduped.parquet
    outs:
      - data/interim/incident_stream.csv
    metrics:
      - reports/incident_stream_metrics.json

  incident_eval:
    cmd: python -m copilot.incidents.detector
    deps:
      - data/interim/incident_stream.csv
    params:
      - params.yaml:
          - incident
    metrics:
      - reports/incident_metrics.json
