seed: 42
f1_gate: 0.70
review_threshold: 0.70
language: en
min_queue_count: 5
split:
  train: 0.70
  val: 0.15
  test: 0.15
# Model hyper-parameters live in configs/train_<task>.yaml (also tracked by DVC).
eval:
  # Test tickets whose closest train/val ticket has TF-IDF cosine below this are
  # reported separately as "novel" (see copilot.models.metrics).
  novelty_threshold: 0.6
promotion:
  novel_f1_gate: 0.40      # a champion must also work on never-seen tickets
  max_regression: 0.005    # challenger may not lose more than this vs. the champion
rag:
  embedder: all-MiniLM-L6-v2
  k: 4
  backend: local_gguf
incident:
  eps: 0.3
  min_samples: 5
  window_minutes: 60
  baseline_window: 7
  replay_rate_seconds: 3
mlflow:
  tracking_uri: sqlite:///mlflow.db
  artifact_root: ./mlartifacts
