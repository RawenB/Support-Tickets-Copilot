name: Model gate

on:
  workflow_dispatch:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0             # dvc metrics/params diff need the base branch
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - name: Install gate tooling
        run: python -m pip install pyyaml dvc
      - name: Enforce model quality gates
        run: python scripts/check_model_gate.py | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Metric and parameter changes vs. main
        if: github.event_name == 'pull_request'
        run: |
          {
            echo "### Metrics vs. main"
            dvc metrics diff origin/main --md --all || true
            echo "### Params vs. main"
            dvc params diff origin/main --md || true
          } >> "$GITHUB_STEP_SUMMARY"
