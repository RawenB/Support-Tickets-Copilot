name: Model gate

on:
  workflow_dispatch:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -e .

      - name: Enforce model quality gate
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          import yaml

          threshold = 0.70
          params_path = Path('params.yaml')
          if params_path.exists():
              with params_path.open('r', encoding='utf-8') as fh:
                  params = yaml.safe_load(fh) or {}
              threshold = float(params.get('f1_gate', threshold))

          reports = [
              Path('reports/metrics_queue.json'),
              Path('reports/metrics_priority.json'),
          ]
          missing = [str(path) for path in reports if not path.exists()]
          if missing:
              raise SystemExit('Missing real metrics report(s): ' + ', '.join(missing))

          failures = []
          for report_path in reports:
              with report_path.open('r', encoding='utf-8') as fh:
                  payload = json.load(fh)

              f1 = float(payload.get('macro_f1', payload.get('macro_f1_score', 0.0)))
              if f1 < threshold:
                  failures.append(f"{report_path.name}: macro_f1={f1:.4f} < threshold={threshold:.2f}")

          if failures:
              raise SystemExit('Model quality gate failed:\n' + '\n'.join(failures))

          print(f'Model quality gate passed for {len(reports)} report(s): threshold={threshold:.2f}')
          PY